name: Build iOS IPA and Android APK

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      hosted_url:
        description: 'Optional HTTPS URL for hosted WKWebView wrapper (leave blank to bundle dist/)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build_ipa:
    name: Build Notifye iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Configure Capacitor hosted URL (optional)
        if: ${{ github.event.inputs.hosted_url != '' }}
        env:
          HOSTED_URL: ${{ github.event.inputs.hosted_url }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.server = { url: process.env.HOSTED_URL, cleartext: false };
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          "

      - name: Add and sync Capacitor iOS project
        run: |
          npm install --no-save @capacitor/cli@^7 @capacitor/ios@^7
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Configure iOS Info.plist, WidgetKit extension & AppIcon
        run: |
          if [ -f "ios-widget/setup-ios-widget.rb" ]; then
            gem install --no-document xcodeproj
            ruby ios-widget/setup-ios-widget.rb
          fi

          PLIST_PATH="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Notifye" "$PLIST_PATH" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Notifye" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Notifye" "$PLIST_PATH" || true
          # Full screen: hide the status bar (also at launch)
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarHidden" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.notifye.app" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string notifye" "$PLIST_PATH" 2>/dev/null || true

          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -f "public/pwa-512x512.png" ] && [ -d "$ICON_DEST" ]; then
            sips -z 1024 1024 public/pwa-512x512.png --out "$ICON_DEST/AppIcon-512@2x.png"
            cat > "$ICON_DEST/Contents.json" << 'EOF'
          {
            "images" : [
              {
                "filename" : "AppIcon-512@2x.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          fi

      - name: Archive unsigned iOS app
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            XC_ARG=(-workspace ios/App/App.xcworkspace)
          else
            XC_ARG=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild \
            "${XC_ARG[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Notifye.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Notifye-unsigned.ipa
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/Notifye.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          cp -R "$APP_PATH" build/ipa/Payload/Notifye.app
          cd build/ipa
          zip -r -y Notifye-unsigned.ipa Payload

      - name: Upload Notifye-unsigned.ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: Notifye-iOS-IPA
          path: build/ipa/Notifye-unsigned.ipa

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp build/ipa/Notifye-unsigned.ipa "build/ipa/Notifye-${TAG}-unsigned.ipa"
          gh release upload "$TAG" "build/ipa/Notifye-${TAG}-unsigned.ipa" --clobber --repo "$GITHUB_REPOSITORY"

  build_apk:
    name: Build Notifye Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Add and sync Capacitor Android project
        run: |
          npm install --no-save @capacitor/cli@^7 @capacitor/android@^7
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Full-screen (immersive) activity
          cp android-native/MainActivity.java android/app/src/main/java/com/notifye/app/MainActivity.java
          npx cap sync android

      - name: Set Android app icon
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          RES=android/app/src/main/res
          # Legacy icons (pre-Android 8) and adaptive-icon foreground (full-bleed maskable art)
          for pair in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read -r density legacy fg <<< "$pair"
            mkdir -p "$RES/mipmap-$density"
            convert public/pwa-512x512.png -resize ${legacy}x${legacy} "$RES/mipmap-$density/ic_launcher.png"
            convert public/pwa-512x512.png -resize ${legacy}x${legacy} \( -size ${legacy}x${legacy} xc:black -fill white -draw "circle $((legacy/2)),$((legacy/2)) $((legacy/2)),0" \) -alpha off -compose CopyOpacity -composite "$RES/mipmap-$density/ic_launcher_round.png"
            convert public/pwa-maskable-512x512.png -resize ${fg}x${fg} "$RES/mipmap-$density/ic_launcher_foreground.png"
          done
          cat > "$RES/values/ic_launcher_background.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0B0B0F</color>
          </resources>
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package Notifye.apk
        run: |
          mkdir -p build/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build/apk/Notifye.apk

      - name: Upload Notifye.apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: Notifye-Android-APK
          path: build/apk/Notifye.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp build/apk/Notifye.apk "build/apk/Notifye-${TAG}.apk"
          gh release upload "$TAG" "build/apk/Notifye-${TAG}.apk" --clobber --repo "$GITHUB_REPOSITORY"
