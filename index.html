<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Notifye — Two-Partner Presence</title>
    <meta name="description" content="A quiet, mobile-first space for two partners. Link accounts with a pairing code and send real-time 'Think of me' and priority attention alerts." />
    <meta property="og:title" content="Notifye — Two-Partner Presence" />
    <meta property="og:description" content="Link accounts with a pairing code and send real-time 'Think of me' attention alerts to your partner." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notifye" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0B0B0F] text-[#F5F5F7] antialiased selection:bg-amber-500/30 selection:text-amber-100">
    <div id="root"></div>
    <script>
      // iOS < 15.4 lacks Object.hasOwn, which the Firebase SDK calls. Classic script, so it runs
      // before the module bundle is evaluated.
      if (!Object.hasOwn) {
        Object.hasOwn = function (o, k) {
          return Object.prototype.hasOwnProperty.call(o, k);
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
